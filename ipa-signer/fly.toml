# Déploiement sur Fly.io (https://fly.io). Depuis le dossier "ipa-signer" :
#   fly launch --copy-config --now
# Fly propose une offre gratuite (petites machines). auto_stop = la machine
# s'éteint quand elle est inactive, et redémarre à la requête suivante.
app = "ipa-signer"
primary_region = "cdg"   # Paris ; changez si besoin (ex. "iad", "lhr").

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
