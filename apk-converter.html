<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APK M to APK Converter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .upload-section {
            border: 2px dashed #667eea;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .upload-section:hover {
            background: #f8f9ff;
            border-color: #764ba2;
        }

        .upload-section.dragover {
            background: #f0f0ff;
            border-color: #764ba2;
        }

        input[type="file"] {
            display: none;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .upload-text {
            color: #333;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .upload-subtext {
            color: #999;
            font-size: 12px;
        }

        .file-info {
            display: none;
            background: #f8f9ff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .file-info.show {
            display: block;
        }

        .file-info-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .file-info-item:last-child {
            margin-bottom: 0;
        }

        .file-info-label {
            color: #666;
            font-weight: 500;
        }

        .file-info-value {
            color: #333;
            font-weight: 600;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-convert {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-convert:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-convert:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-clear {
            background: #f0f0f0;
            color: #333;
        }

        .btn-clear:hover {
            background: #e0e0e0;
        }

        .progress {
            display: none;
            margin-bottom: 20px;
        }

        .progress.show {
            display: block;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
            text-align: center;
        }

        .success-message {
            display: none;
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .success-message.show {
            display: block;
        }

        .error-message {
            display: none;
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .error-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 APK M to APK Converter</h1>
        <p class="subtitle">Convertir vos fichiers APK M vers le format APK standard</p>

        <div class="error-message" id="errorMsg"></div>
        <div class="success-message" id="successMsg"></div>

        <div class="upload-section" id="uploadSection">
            <div class="upload-icon">📦</div>
            <div class="upload-text">Glissez-déposez votre fichier APK M ici</div>
            <div class="upload-subtext">ou cliquez pour sélectionner</div>
            <input type="file" id="fileInput" accept=".apk,.aab" />
        </div>

        <div class="file-info" id="fileInfo">
            <div class="file-info-item">
                <span class="file-info-label">Fichier:</span>
                <span class="file-info-value" id="fileName">-</span>
            </div>
            <div class="file-info-item">
                <span class="file-info-label">Taille:</span>
                <span class="file-info-value" id="fileSize">-</span>
            </div>
            <div class="file-info-item">
                <span class="file-info-label">Type:</span>
                <span class="file-info-value" id="fileType">-</span>
            </div>
        </div>

        <div class="progress" id="progress">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">0%</div>
        </div>

        <div class="button-group">
            <button class="btn-convert" id="convertBtn" disabled>Convertir</button>
            <button class="btn-clear" id="clearBtn">Effacer</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
        const uploadSection = document.getElementById('uploadSection');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const convertBtn = document.getElementById('convertBtn');
        const clearBtn = document.getElementById('clearBtn');
        const progress = document.getElementById('progress');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');

        let selectedFile = null;

        uploadSection.addEventListener('click', () => fileInput.click());
        uploadSection.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadSection.classList.add('dragover');
        });
        uploadSection.addEventListener('dragleave', () => {
            uploadSection.classList.remove('dragover');
        });
        uploadSection.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadSection.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFileSelect(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileSelect(e.target.files[0]);
            }
        });

        convertBtn.addEventListener('click', convertFile);
        clearBtn.addEventListener('click', resetForm);

        function handleFileSelect(file) {
            hideMessages();
            selectedFile = file;
            const isValid = file.name.endsWith('.apkm') || file.name.endsWith('.apk') || file.name.endsWith('.aab');

            if (!isValid) {
                showError('Veuillez sélectionner un fichier .apkm, .apk ou .aab');
                selectedFile = null;
                return;
            }

            document.getElementById('fileName').textContent = file.name;
            document.getElementById('fileSize').textContent = formatFileSize(file.size);
            document.getElementById('fileType').textContent = file.name.split('.').pop().toUpperCase();

            fileInfo.classList.add('show');
            convertBtn.disabled = false;
        }

        async function convertFile() {
            if (!selectedFile) return;

            hideMessages();
            progress.classList.add('show');
            convertBtn.disabled = true;

            try {
                const fileName = selectedFile.name.toLowerCase();

                if (fileName.endsWith('.apkm')) {
                    await convertApkmToApk(selectedFile);
                } else if (fileName.endsWith('.aab')) {
                    await convertAabToApk(selectedFile);
                } else if (fileName.endsWith('.apk')) {
                    showError('Le fichier est déjà un APK valide');
                    convertBtn.disabled = false;
                    progress.classList.remove('show');
                }
            } catch (error) {
                showError('Erreur lors de la conversion: ' + error.message);
                convertBtn.disabled = false;
                progress.classList.remove('show');
            }
        }

        async function convertApkmToApk(file) {
            const zip = new JSZip();
            const arrayBuffer = await file.arrayBuffer();

            updateProgress(30);

            const loadedZip = await zip.loadAsync(arrayBuffer);

            updateProgress(60);

            const newZip = new JSZip();
            for (const [path, zipEntry] of Object.entries(loadedZip.files)) {
                if (!zipEntry.dir) {
                    const data = await zipEntry.async('uint8array');
                    newZip.file(path, data);
                }
            }

            updateProgress(80);

            const blob = await newZip.generateAsync({ type: 'blob' });
            downloadFile(blob, file.name.replace(/\.apkm$/i, '.apk'));

            updateProgress(100);
            setTimeout(() => {
                progress.classList.remove('show');
                convertBtn.disabled = false;
                showSuccess('✓ Conversion .apkm → .apk réussie!');
            }, 500);
        }

        async function convertAabToApk(file) {
            const zip = new JSZip();
            const arrayBuffer = await file.arrayBuffer();

            updateProgress(30);

            const loadedZip = await zip.loadAsync(arrayBuffer);

            updateProgress(60);

            const newZip = new JSZip();
            for (const [path, zipEntry] of Object.entries(loadedZip.files)) {
                if (!zipEntry.dir && path.startsWith('base/')) {
                    const data = await zipEntry.async('uint8array');
                    const newPath = path.replace('base/', '');
                    newZip.file(newPath, data);
                }
            }

            updateProgress(80);

            const blob = await newZip.generateAsync({ type: 'blob' });
            downloadFile(blob, file.name.replace(/\.aab$/i, '.apk'));

            updateProgress(100);
            setTimeout(() => {
                progress.classList.remove('show');
                convertBtn.disabled = false;
                showSuccess('✓ Conversion .aab → .apk réussie!');
            }, 500);
        }

        function updateProgress(percent) {
            progressFill.style.width = percent + '%';
            progressText.textContent = percent + '%';
        }

        function downloadFile(blob, fileName) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function resetForm() {
            selectedFile = null;
            fileInput.value = '';
            fileInfo.classList.remove('show');
            progress.classList.remove('show');
            progressFill.style.width = '0%';
            progressText.textContent = '0%';
            convertBtn.disabled = true;
            hideMessages();
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round((bytes / Math.pow(k, i)) * 100) / 100 + ' ' + sizes[i];
        }

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.classList.add('show');
        }

        function showSuccess(msg) {
            successMsg.textContent = msg;
            successMsg.classList.add('show');
        }

        function hideMessages() {
            errorMsg.classList.remove('show');
            successMsg.classList.remove('show');
        }
    </script>
</body>
</html>
