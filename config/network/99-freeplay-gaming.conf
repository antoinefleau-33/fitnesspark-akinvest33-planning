# FreePlay OS — réglages réseau et mémoire pour le jeu et le streaming 4K.

# File d'attente réseau moderne + algorithme BBR de Google :
# meilleur débit et latence plus stable, surtout en Wi-Fi.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Buffers réseau plus grands (flux 4K, téléchargements Steam)
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_fastopen = 3

# N'utiliser le swap qu'en dernier recours (fluidité en jeu)
vm.swappiness = 10
