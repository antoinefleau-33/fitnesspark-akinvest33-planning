<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audit de ressources web</title>
<style>
  body { font-family: monospace; margin: 20px; max-width: 900px; }
  input { width: 60%; padding: 6px; }
  button { padding: 6px 12px; }
  .note { background: #fff8dc; border: 1px solid #ddcc88; padding: 8px; margin: 10px 0; font-size: 13px; }
  .cols { display: flex; gap: 20px; margin-top: 15px; }
  .col { flex: 1; }
  h2 { font-size: 15px; border-bottom: 1px solid #ccc; }
  ul { padding-left: 18px; word-break: break-all; }
  #status { color: #444; margin-top: 10px; }
  .err { color: #b00; }
</style>
</head>
<body>
  <h1>Audit de ressources web</h1>

  <div>
    <input type="text" id="url" placeholder="https://exemple.com" />
    <button id="run">Analyser</button>
  </div>

  <div class="note">
    En raison des limitations CORS, la récupération directe échouera pour la
    plupart des domaines tiers. Cet outil fonctionne mieux via une extension de
    navigateur désactivant CORS, ou derrière un serveur local avec proxy.
  </div>

  <div id="status"></div>

  <div class="cols">
    <div class="col">
      <h2>Ressources directes</h2>
      <ul id="direct"></ul>
    </div>
    <div class="col">
      <h2>Dépendances externes</h2>
      <ul id="external"></ul>
    </div>
  </div>

<script>
// Extensions considérées comme ressources directes (binaires / archives / médias).
const DIRECT_EXT = [
  'exe','msi','zip','rar','7z','tar','gz',
  'mp3','wav','mp4','mov','avi','mkv','webm',
  'pdf','iso','dmg','apk','bin'
];

// Hôtes/plateformes de CDN et d'hébergement de code brut à repérer.
const EXTERNAL_HOSTS = [
  'cdn.discordapp.com','raw.githubusercontent.com','jsdelivr.net',
  'cdnjs.cloudflare.com','unpkg.com','gist.githubusercontent.com',
  'pastebin.com','githubusercontent.com','media.discordapp.net'
];

const $ = (id) => document.getElementById(id);

// Vide une liste puis y insère des liens cliquables (dédupliqués).
function render(listEl, urls) {
  listEl.innerHTML = '';
  [...new Set(urls)].forEach((u) => {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = u; a.textContent = u; a.target = '_blank'; a.rel = 'noopener';
    li.appendChild(a);
    listEl.appendChild(li);
  });
}

// Analyse un document DOM à partir d'une URL de base et sépare les deux catégories.
function analyze(doc, baseUrl) {
  const direct = [];
  const external = [];
  const extRe = new RegExp('\\.(' + DIRECT_EXT.join('|') + ')(\\?|#|$)', 'i');

  // Résout une URL relative en absolue par rapport à la page cible.
  const resolve = (val) => { try { return new URL(val, baseUrl).href; } catch { return null; } };
  const baseHost = (() => { try { return new URL(baseUrl).hostname; } catch { return ''; } })();

  // a[href] -> ressources directes selon l'extension de fichier.
  doc.querySelectorAll('a[href]').forEach((a) => {
    const abs = resolve(a.getAttribute('href'));
    if (abs && extRe.test(abs)) direct.push(abs);
  });

  // Tout href/src -> dépendances externes selon l'hôte.
  doc.querySelectorAll('[href],[src]').forEach((el) => {
    const raw = el.getAttribute('href') || el.getAttribute('src');
    const abs = resolve(raw);
    if (!abs) return;
    let host;
    try { host = new URL(abs).hostname; } catch { return; }
    const isKnown = EXTERNAL_HOSTS.some((h) => host === h || host.endsWith('.' + h));
    const isForeign = baseHost && host && host !== baseHost;
    if (isKnown || isForeign) external.push(abs);
  });

  return { direct, external };
}

async function run() {
  const url = $('url').value.trim();
  const status = $('status');
  if (!url) { status.innerHTML = '<span class="err">Saisir une URL.</span>'; return; }

  status.textContent = 'Récupération…';
  render($('direct'), []);
  render($('external'), []);

  try {
    const res = await fetch(url);
    const html = await res.text();
    // Parse le HTML brut en objet DOM sans l'exécuter.
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const { direct, external } = analyze(doc, url);
    render($('direct'), direct);
    render($('external'), external);
    status.textContent = `Terminé — ${direct.length} directe(s), ${external.length} externe(s).`;
  } catch (e) {
    status.innerHTML = '<span class="err">Échec (probablement CORS) : ' + e.message + '</span>';
  }
}

$('run').addEventListener('click', run);
$('url').addEventListener('keydown', (e) => { if (e.key === 'Enter') run(); });
</script>
</body>
</html>
