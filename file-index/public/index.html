<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes fichiers</title>
<meta name="theme-color" content="#111827">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📁</text></svg>">
<style>
  :root{
    --bg:#111827; --panel:#1f2937; --panel-2:#273244; --line:#374151;
    --text:#f3f4f6; --muted:#9ca3af; --accent:#facc15; --accent-soft:rgba(250,204,21,.12);
    --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}
  .wrap{max-width:1000px; margin:0 auto; padding:24px 16px 64px}

  /* ---------- Header ---------- */
  header{display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; justify-content:space-between; margin-bottom:20px}
  .brand{font-size:26px; font-weight:800; font-style:italic; text-transform:uppercase; letter-spacing:-.5px; margin:0}
  .brand span{border-bottom:3px solid var(--accent); padding-bottom:2px}
  .tagline{color:var(--muted); font-size:14px; margin:6px 0 0}
  .stats{color:var(--muted); font-size:13px; text-align:right}
  .stats b{color:var(--text)}

  /* ---------- Toolbar ---------- */
  .toolbar{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:14px}
  .search{flex:1 1 240px; position:relative}
  .search input{
    width:100%; padding:11px 14px 11px 38px; border-radius:var(--radius);
    border:1px solid var(--line); background:var(--panel); color:var(--text); font-size:15px;
  }
  .search input:focus{outline:none; border-color:var(--accent)}
  .search::before{content:"⌕"; position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:18px}
  select{
    padding:11px 12px; border-radius:var(--radius); border:1px solid var(--line);
    background:var(--panel); color:var(--text); font-size:14px; cursor:pointer;
  }
  select:focus{outline:none; border-color:var(--accent)}

  .filters{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .chip{
    border:1px solid var(--line); background:var(--panel); color:var(--muted);
    padding:6px 12px; border-radius:999px; font-size:12.5px; font-weight:600;
    cursor:pointer; text-transform:uppercase; letter-spacing:.4px;
  }
  .chip:hover{border-color:var(--accent); color:var(--text)}
  .chip.active{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}
  .chip .n{opacity:.6; margin-left:6px; font-weight:500}

  /* ---------- Liste ---------- */
  ul.list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
  li.item{
    display:flex; align-items:center; gap:14px;
    background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--line);
    border-radius:var(--radius); padding:12px 14px; transition:border-color .15s, transform .15s, background .15s;
  }
  li.item:hover{border-color:var(--line); border-left-color:var(--accent); background:var(--panel-2); transform:translateY(-1px)}
  .icon{
    flex:0 0 42px; height:42px; display:grid; place-items:center;
    background:#111827; border-radius:10px; font-size:11px; font-weight:800;
    color:var(--accent); text-transform:uppercase; letter-spacing:.5px; overflow:hidden;
  }
  .info{flex:1 1 auto; min-width:0}
  .name{
    display:block; font-weight:600; font-size:15px; text-decoration:none;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .name:hover{color:var(--accent); text-decoration:underline}
  .meta{font-size:12.5px; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .meta .sep{opacity:.4; margin:0 6px}
  .tag-ext{color:var(--accent); font-weight:600; text-transform:uppercase}
  .badge-ext{
    display:inline-block; font-size:10.5px; padding:1px 6px; border-radius:4px;
    background:var(--accent-soft); color:var(--accent); font-weight:700; text-transform:uppercase;
  }
  .actions{flex:0 0 auto; display:flex; gap:6px}
  .btn{
    border:1px solid var(--line); background:#111827; color:var(--muted);
    border-radius:8px; padding:7px 11px; font-size:13px; cursor:pointer;
    text-decoration:none; display:inline-flex; align-items:center; gap:6px; font-family:inherit;
  }
  .btn:hover{border-color:var(--accent); color:var(--accent)}
  .btn-main{background:var(--accent); border-color:var(--accent); color:#111827; font-weight:700}
  .btn-main:hover{background:#eab308; border-color:#eab308; color:#111827}

  /* ---------- États ---------- */
  .state{
    border:1px dashed var(--line); border-radius:var(--radius);
    padding:32px 20px; text-align:center; color:var(--muted);
  }
  .state h2{color:var(--text); font-size:17px; margin:0 0 8px}
  .state code{
    background:#0b1220; border:1px solid var(--line); border-radius:6px;
    padding:2px 6px; color:var(--accent); font-size:13px;
  }
  .state.error{border-color:#7f1d1d; border-style:solid; background:rgba(127,29,29,.15)}
  footer{margin-top:28px; text-align:center; color:var(--muted); font-size:12px}

  #toast{
    position:fixed; left:50%; bottom:24px; transform:translate(-50%,20px);
    background:var(--accent); color:#111827; font-weight:700; font-size:14px;
    padding:10px 18px; border-radius:999px; opacity:0; pointer-events:none;
    transition:opacity .2s, transform .2s; z-index:50;
  }
  #toast.show{opacity:1; transform:translate(-50%,0)}

  @media (max-width:640px){
    .stats{text-align:left}
    li.item{flex-wrap:wrap}
    .actions{width:100%; justify-content:flex-end}
    .meta{white-space:normal}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1 class="brand"><span id="site-name">Mes fichiers</span></h1>
      <p class="tagline" id="tagline"></p>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="toolbar">
    <div class="search">
      <input id="search" type="search" placeholder="Rechercher un fichier…" autocomplete="off" spellcheck="false">
    </div>
    <select id="sort" aria-label="Trier">
      <option value="name">Nom (A → Z)</option>
      <option value="date">Plus récent</option>
      <option value="size">Plus lourd</option>
      <option value="type">Type</option>
    </select>
  </div>

  <div class="filters" id="filters"></div>

  <div id="content"></div>

  <footer id="footer"></footer>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  var state = { items: [], query: '', ext: 'all', sort: 'name' };

  var el = {
    siteName: document.getElementById('site-name'),
    tagline: document.getElementById('tagline'),
    stats: document.getElementById('stats'),
    search: document.getElementById('search'),
    sort: document.getElementById('sort'),
    filters: document.getElementById('filters'),
    content: document.getElementById('content'),
    footer: document.getElementById('footer'),
    toast: document.getElementById('toast')
  };

  /* ------------------------- utilitaires ------------------------- */

  function humanSize(bytes) {
    if (typeof bytes !== 'number' || !isFinite(bytes) || bytes < 0) return '';
    if (bytes < 1024) return bytes + ' o';
    var units = ['Ko', 'Mo', 'Go', 'To'], v = bytes / 1024, i = 0;
    while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
    return (v < 10 ? v.toFixed(1) : Math.round(v)) + ' ' + units[i];
  }

  function humanDate(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  function toast(message) {
    el.toast.textContent = message;
    el.toast.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.toast.classList.remove('show'); }, 1800);
  }

  function absoluteUrl(url) {
    return new URL(url, window.location.href).href;
  }

  function copyLink(url) {
    var full = absoluteUrl(url);
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(full).then(
        function () { toast('Lien copié'); },
        function () { fallbackCopy(full); }
      );
    } else {
      fallbackCopy(full);
    }
  }

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? 'Lien copié' : 'Copie impossible');
  }

  /* --------------------------- rendu ----------------------------- */

  function matches(item) {
    if (state.ext !== 'all' && item.ext !== state.ext) return false;
    if (!state.query) return true;
    var q = state.query;
    return (
      item.name.toLowerCase().indexOf(q) !== -1 ||
      (item.folder || '').toLowerCase().indexOf(q) !== -1 ||
      (item.description || '').toLowerCase().indexOf(q) !== -1 ||
      (item.host || '').toLowerCase().indexOf(q) !== -1
    );
  }

  function sortItems(list) {
    var by = state.sort;
    return list.slice().sort(function (a, b) {
      if (by === 'size') return (b.size || 0) - (a.size || 0);
      if (by === 'date') return new Date(b.modified || 0) - new Date(a.modified || 0);
      if (by === 'type' && a.ext !== b.ext) return a.ext.localeCompare(b.ext, 'fr');
      return a.name.localeCompare(b.name, 'fr', { numeric: true, sensitivity: 'base' });
    });
  }

  function renderFilters() {
    var counts = {};
    state.items.forEach(function (item) { counts[item.ext] = (counts[item.ext] || 0) + 1; });

    var exts = Object.keys(counts).sort(function (a, b) {
      return counts[b] - counts[a] || a.localeCompare(b, 'fr');
    });

    el.filters.innerHTML = '';
    if (!state.items.length) return;

    [{ key: 'all', label: 'Tous', n: state.items.length }]
      .concat(exts.map(function (e) { return { key: e, label: e, n: counts[e] }; }))
      .forEach(function (f) {
        var chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'chip' + (state.ext === f.key ? ' active' : '');
        chip.textContent = f.label;

        var n = document.createElement('span');
        n.className = 'n';
        n.textContent = f.n;
        chip.appendChild(n);

        chip.addEventListener('click', function () {
          state.ext = f.key;
          renderFilters();
          renderList();
        });
        el.filters.appendChild(chip);
      });
  }

  function buildItem(item) {
    var li = document.createElement('li');
    li.className = 'item';

    var icon = document.createElement('div');
    icon.className = 'icon';
    icon.textContent = item.ext.slice(0, 4);
    li.appendChild(icon);

    var info = document.createElement('div');
    info.className = 'info';

    var link = document.createElement('a');
    link.className = 'name';
    link.href = item.url;
    link.textContent = item.name;
    if (item.source === 'external') {
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
    }
    info.appendChild(link);

    var meta = document.createElement('div');
    meta.className = 'meta';
    var parts = [];

    var badge = '<span class="badge-ext">' + escapeHtml(item.ext) + '</span>';
    if (item.sizeLabel) parts.push(escapeHtml(item.sizeLabel));
    else if (typeof item.size === 'number') parts.push(escapeHtml(humanSize(item.size)));
    if (item.modified) parts.push(escapeHtml(humanDate(item.modified)));
    if (item.folder) parts.push('📂 ' + escapeHtml(item.folder));
    if (item.source === 'external' && item.host) parts.push('🔗 ' + escapeHtml(item.host));
    if (item.description) parts.push(escapeHtml(item.description));

    meta.innerHTML = badge + (parts.length ? '<span class="sep">·</span>' + parts.join('<span class="sep">·</span>') : '');
    info.appendChild(meta);
    li.appendChild(info);

    var actions = document.createElement('div');
    actions.className = 'actions';

    var copy = document.createElement('button');
    copy.type = 'button';
    copy.className = 'btn';
    copy.title = 'Copier le lien';
    copy.textContent = 'Copier';
    copy.addEventListener('click', function () { copyLink(item.url); });
    actions.appendChild(copy);

    var dl = document.createElement('a');
    dl.className = 'btn btn-main';
    dl.href = item.url;
    if (item.source === 'local') {
      dl.setAttribute('download', '');
      dl.textContent = 'Télécharger';
    } else {
      dl.target = '_blank';
      dl.rel = 'noopener noreferrer';
      dl.textContent = 'Ouvrir';
    }
    actions.appendChild(dl);

    li.appendChild(actions);
    return li;
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function renderList() {
    var list = sortItems(state.items.filter(matches));
    el.content.innerHTML = '';

    if (!state.items.length) {
      el.content.appendChild(emptyProject());
      return;
    }
    if (!list.length) {
      var none = document.createElement('div');
      none.className = 'state';
      none.innerHTML = '<h2>Aucun résultat</h2><p>Rien ne correspond à cette recherche.</p>';
      el.content.appendChild(none);
      return;
    }

    var ul = document.createElement('ul');
    ul.className = 'list';
    list.forEach(function (item) { ul.appendChild(buildItem(item)); });
    el.content.appendChild(ul);

    var shownSize = list.reduce(function (s, i) { return s + (i.size || 0); }, 0);
    el.stats.innerHTML =
      '<b>' + list.length + '</b> fichier' + (list.length > 1 ? 's' : '') +
      (list.length !== state.items.length ? ' / ' + state.items.length : '') +
      (shownSize ? '<span class="sep"> · </span><b>' + escapeHtml(humanSize(shownSize)) + '</b>' : '');
  }

  function emptyProject() {
    var div = document.createElement('div');
    div.className = 'state';
    div.innerHTML =
      '<h2>Aucun fichier pour le moment</h2>' +
      '<p>Dépose tes fichiers (.exe, .zip, .pdf…) dans <code>public/files/</code>,<br>' +
      'puis lance <code>npm run scan</code> et redéploie.</p>' +
      '<p>Pour un fichier hébergé sur un autre de tes sites, ajoute-le dans <code>config.json</code> &gt; <code>links</code>.</p>';
    return div;
  }

  function renderError(message) {
    el.content.innerHTML = '';
    var div = document.createElement('div');
    div.className = 'state error';
    div.innerHTML =
      '<h2>Manifeste introuvable</h2>' +
      '<p>' + escapeHtml(message) + '</p>' +
      '<p>Génère-le avec <code>npm run scan</code> (il crée <code>public/files.json</code>).</p>';
    el.content.appendChild(div);
  }

  /* -------------------------- démarrage -------------------------- */

  el.search.addEventListener('input', function () {
    state.query = el.search.value.trim().toLowerCase();
    renderList();
  });

  el.sort.addEventListener('change', function () {
    state.sort = el.sort.value;
    renderList();
  });

  fetch('files.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function (data) {
      state.items = Array.isArray(data.items) ? data.items : [];

      if (data.siteName) {
        el.siteName.textContent = data.siteName;
        document.title = data.siteName;
      }
      el.tagline.textContent = data.tagline || '';
      el.footer.textContent = data.generatedAt
        ? 'Index généré le ' + new Date(data.generatedAt).toLocaleString('fr-FR')
        : '';

      renderFilters();
      renderList();
    })
    .catch(function (err) {
      renderError(err.message);
    });
})();
</script>
</body>
</html>
