name: Compiler l'application FreePlay TV

# Recompile l'APK à chaque modification du launcher, et à la demande.
on:
  push:
    paths:
      - 'tablette-android/launcher/**'
      - '.github/workflows/build-launcher.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lancer les tests
        working-directory: tablette-android/launcher
        run: ./gradlew testReleaseUnitTest

      - name: Construire l'APK
        working-directory: tablette-android/launcher
        run: ./gradlew assembleRelease

      - name: Publier l'APK téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: FreePlayTV-apk
          path: tablette-android/launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
